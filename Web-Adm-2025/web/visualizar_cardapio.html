<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Padaria Paladar Nobre</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="/docs/Imagem/download2.png" type="image/x-icon">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="/styles/global_new.css">
    <link rel="stylesheet" href="/styles/cardapio.css">
</head>
<body>
    <header class="header">
            <div class="logo">
            <img src="/docs/logoPN.png" alt="Logo Paladar Nobre">
        </div>
        <nav>
            <div class="header--menu">
                <div class="search--box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Buscar produtos..." aria-label="Buscar produtos">
                </div>
                    <a href="dashboard.html" class="logo" aria-label="Ir para the Dashboard">
    </a>
    <nav class="navbar" aria-label="Navegação principal">
        <ul id="admin-nav-list">
            <li><a href="/Web-Adm-2025/admin/dashboard.html" class="nav-link"><i class="fas fa-chart-line"></i> Painel Admin</a></li>
            <li><a href="/Web-Adm-2025/admin/gerenciar_cardapio.html" class="nav-link"><i class="fas fa-utensils"></i> Gerenciar Cardápio</a></li>
            <li><a href="/Web-Adm-2025/admin/gerenciar_pedidos.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Gerenciar Pedidos</a></li>
            <li id="logout-placeholder"></li>
        </ul>
    </nav>
 

        </nav>
        
        <!-- Menu Mobile Toggle -->
        <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <main>
        <section class="products" id="products">
            <div class="container">
                <header class="section-header">
                    <h1 class="heading">Nosso <span>CARDÁPIO</span></h1>
                </header>
                
                <!-- Filtros -->
                <div class="filters">
                    <div class="filter-buttons">
                        <button class="btn btn-secondary active" data-filter="all">Todos</button>
                        <button class="btn btn-secondary" data-filter="disponivel">Disponível</button>
                        <button class="btn btn-secondary" data-filter="indisponivel">Indisponível</button>
                    </div>
                </div>

                <!-- Grid de Produtos -->
                <div class="box-container" role="grid"></div>
            </div>
        </section>

        <!-- Modal de Detalhes do Produto -->
        <div id="itemModal" class="modal">
            <div class="modal-content">
                <button class="close" aria-label="Fechar modal">&times;</button>
                <div class="modal-body">
                    <img id="modal-img" src="" alt="">
                    <div class="modal-info">
                        <h2 id="modal-nome"></h2>
                        <p id="modal-desc"></p>
                        <div class="modal-footer">
                            <p id="modal-preco" class="price"></p>
                            <button class="btn btn-primary add-to-cart">
                                <i class="fas fa-shopping-cart"></i>
                                Adicionar ao Carrinho
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    <!-- Scripts -->
    <script src="/scripts/cardapio.js"></script>
    <script>
        // Menu Mobile Toggle
        document.querySelector('.menu-toggle').addEventListener('click', function() {
            this.classList.toggle('active');
            this.setAttribute('aria-expanded', this.classList.contains('active'));
            document.querySelector('nav').classList.toggle('active');
        });
    </script>
    
    <script src="/scripts/auth.js"></script>
</body>
</html>
